[tool.uv.workspace]
members = ["etl", "question_generator", "explorer"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

# Configuración de pytest para el workspace
[tool.pytest.ini_options]
testpaths = ["etl/tests", "question_generator/tests", "explorer/tests"]
pythonpath = ["etl/src", "question_generator/src", "explorer/src"]
norecursedirs = ["data", ".venv", "graphify-out", ".agents"]
