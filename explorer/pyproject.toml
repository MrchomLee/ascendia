[project]
name = "explorer"
version = "0.1.0"
description = "Local Streamlit dev tool to inspect and validate ETL extractions"
requires-python = ">=3.12,<3.15"
dependencies = [
    "etl",
    "question_generator",
    # 1.40 es donde aparece `st.segmented_control`, con el que se marca el
    # estado de revisión de una pregunta.
    "streamlit>=1.40",
]

[tool.uv.sources]
etl = { workspace = true }
question_generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorer"]
